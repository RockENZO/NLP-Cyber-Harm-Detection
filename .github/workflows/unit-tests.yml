name: Unit tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Verify recursive checkout integrity
        run: git submodule update --init --recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the preview renderer dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - run: python -m unittest discover -s evaluation -p 'test_*.py'
