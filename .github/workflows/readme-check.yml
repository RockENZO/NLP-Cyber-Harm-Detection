name: README references

# A target can disappear even when README.md itself is unchanged.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Check documented local references
        uses: RockENZO/readme-reality@d8f1d521c1f13c9916ae455222271e1b701b6f71 # v0.3.0
        with:
          root: .
          readme: |
            README.md
            docs/EVALUATION.md
            docs/SCORER_PERFORMANCE.md
